<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>MindAR + Three Debug</title>

  <!-- ✅ Correct scripts -->
  <script src="https://unpkg.com/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.164.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>

<script>
const start = async () => {

  console.log("MINDAR:", window.MINDAR); // 🔍 debug

  if (!window.MINDAR) {
    alert("MindAR not loaded ❌");
    return;
  }

  const mindarThree = new window.MINDAR.IMAGE.MindARThree({
    container: document.body,
    imageTargetSrc: "./assets/targets.mind",
  });

  const { renderer, scene, camera } = mindarThree;

  // LIGHT
  const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5);
  scene.add(light);

  const anchor = mindarThree.addAnchor(0);

  // DEBUG BOX
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(0.2, 0.2, 0.2),
    new THREE.MeshBasicMaterial({ color: "red" })
  );
  anchor.group.add(box);

  // GLB LOADER
  const loader = new THREE.GLTFLoader();

  loader.load(
    "./assets/scene.glb",
    (gltf) => {
      console.log("✅ GLB LOADED");

      const model = gltf.scene;
      model.scale.set(0.2, 0.2, 0.2);
      model.position.set(0, 0, 0.1);

      anchor.group.add(model);
    },
    undefined,
    (err) => {
      console.error("❌ GLB ERROR:", err);
    }
  );

  await mindarThree.start();

  renderer.setAnimationLoop(() => {
    renderer.render(scene, camera);
  });
};

start();
</script>

</body>
</html>
