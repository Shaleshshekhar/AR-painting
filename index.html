<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>MindAR + Three Debug</title>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar/dist/mindar-image-three.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.164.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>

<script>
const start = async () => {

  const mindarThree = new window.MINDAR.IMAGE.MindARThree({
    container: document.body,
    imageTargetSrc: "./assets/targets.mind",
  });

  const { renderer, scene, camera } = mindarThree;

  // LIGHTS (important)
  const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5);
  scene.add(light);

  // TARGET
  const anchor = mindarThree.addAnchor(0);

  // DEBUG BOX (to confirm tracking)
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(0.2, 0.2, 0.2),
    new THREE.MeshBasicMaterial({ color: "red" })
  );
  anchor.group.add(box);

  // ===== LOAD GLB =====
  const loader = new THREE.GLTFLoader();

  loader.load(
    "./assets/scene.glb",

    (gltf) => {
      console.log("✅ GLB LOADED SUCCESSFULLY");

      const model = gltf.scene;

      model.position.set(0, 0, 0.1);
      model.scale.set(0.1, 0.1, 0.1);

      anchor.group.add(model);
    },

    undefined,

    (error) => {
      console.error("❌ GLB LOAD ERROR:", error);
    }
  );

  await mindarThree.start();

  renderer.setAnimationLoop(() => {
    renderer.render(scene, camera);
  });
};

start();
</script>

</body>
</html>
