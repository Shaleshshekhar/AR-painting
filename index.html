<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true; toneMapping: NoToneMapping;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <a-assets>
        <a-asset-item id="avatarModel" src="./assets/3dscene_bake.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">

        <!-- UNLIT MODEL -->
        <a-gltf-model
          src="#avatarModel"
          position="0 0 0.1"
          scale="0.2 0.2 0.2"
          rotation="0 270 0"
          unlit-model>
        </a-gltf-model>

      </a-entity>

    </a-scene>

    <!-- FORCE UNLIT -->
    <script>
    AFRAME.registerComponent('unlit-model', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');

          mesh.traverse((node) => {
            if (!node.isMesh) return;

            const original = node.material;

            node.material = new THREE.MeshBasicMaterial({
              map: original.map || null
            });

            // Fix encoding
            if (node.material.map) {
              node.material.map.encoding = THREE.sRGBEncoding;
            }
          });
        });
      }
    });
    </script>

  </body>
</html>
