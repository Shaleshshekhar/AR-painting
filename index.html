<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./assets/targets.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <!-- Assets -->
  <a-assets>
    <a-asset-item id="model" src="./assets/scene.glb"></a-asset-item>
  </a-assets>

  <!-- Camera -->
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- Target -->
  <a-entity mindar-image-target="targetIndex: 0">

    <!-- Debug Box -->
    <a-box
      position="0 0 0"
      depth="0.2"
      height="0.2"
      width="0.2"
      color="red"
    ></a-box>

    <!-- 3D MODEL with SCALE ANIMATION -->
    <a-gltf-model
      src="#model"
      position="0 0 0.1"
      rotation="0 0 0"
      scale="0.001 0.001 0.001"

      animation="property: scale;
                 from: 0.001 0.001 0.001;
                 to: 5 5 5;
                 dur: 10000;
                 easing: linear;
                 loop: true">
    </a-gltf-model>

    <!-- LIGHTS (IMPORTANT) -->
    <a-entity light="type: ambient; intensity: 1.5"></a-entity>
    <a-entity light="type: directional; intensity: 1" position="1 1 1"></a-entity>

  </a-entity>

</a-scene>

</body>
</html>
