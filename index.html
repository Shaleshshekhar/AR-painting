<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindAR GLB Example</title>

  <!-- MindAR + Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>
<script>
  const start = async () => {
    // Initialize MindAR
    const mindarThree = new window.MINDAR.IMAGE.MindARThree({
      container: document.body,
      imageTargetSrc: './assets/targets.mind',
    });

    const {renderer, scene, camera} = mindarThree;

    // Anchor for target index 0
    const anchor = mindarThree.addAnchor(0);

    // Light
    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
    scene.add(light);

    // Load GLB model
    const loader = new THREE.GLTFLoader();
    loader.load('./assets/scene.glb', (gltf) => {
      const model = gltf.scene;

      // Adjust scale/position as needed
      model.scale.set(0.2, 0.2, 0.2);
      model.position.set(0, 0, 0);

      anchor.group.add(model);
    });

    // Start AR
    await mindarThree.start();

    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
    });
  };

  start();
</script>

<!-- Three.js extras -->
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/loaders/GLTFLoader.js"></script>

</body>
</html>
