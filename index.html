<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./assets/targets.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <!-- Assets -->
  <a-assets>
    <a-asset-item id="model" src="./assets/scene.glb"></a-asset-item>
  </a-assets>

  <!-- Camera -->
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- Target -->
  <a-entity mindar-image-target="targetIndex: 0">

    <!-- Debug Box -->
    <a-box position="0 0 0" depth="0.2" height="0.2" width="0.2" color="red" animation="property: scale;
             from: 0.0001 0.0001 0.0001;
             to: 50 50 50;
             dur: 2000;
             easing: linear;
             loop: true"></a-box>

    <!-- MODEL -->
<a-gltf-model
  id="debugModel"
  src="#model"
  position="0 0 0"

  scale="0.0001 0.0001 0.0001"

  animation="property: scale;
             from: 0.0001 0.0001 0.0001;
             to: 50 50 50;
             dur: 2000;
             easing: linear;
             loop: true">
</a-gltf-model>

    <!-- LIGHTS -->
    <a-entity light="type: ambient; intensity: 2"></a-entity>
    <a-entity light="type: directional; intensity: 1.5" position="1 1 1"></a-entity>

  </a-entity>

</a-scene>

<script>
window.addEventListener('load', () => {

  const scene = document.querySelector('a-scene');

  scene.addEventListener('loaded', () => {
    console.log("Scene loaded");

    const model = document.querySelector('#debugModel');

    if (!model) {
      console.log("❌ Model element not found");
      return;
    }

    console.log("✅ Model element found");

    // 🔴 CRITICAL: catch failure
    model.addEventListener('model-error', (e) => {
      console.error("❌ MODEL LOAD ERROR:", e.detail);
    });

    // ✅ success case
    model.addEventListener('model-loaded', () => {
      console.log("✅ GLB LOADED");

      setInterval(() => {
        const s = model.object3D.scale;
        console.log(`Scale → x:${s.x.toFixed(2)} y:${s.y.toFixed(2)} z:${s.z.toFixed(2)}`);
      }, 500);
    });

    // 🔥 fallback: check anyway (even if load fails)
    setInterval(() => {
      if (model.object3D) {
        const s = model.object3D.scale;
        console.log(`(fallback) Scale → ${s.x.toFixed(2)}`);
      }
    }, 1000);

  });

});
</script>

</body>
</html>
